# dnsmasq: network-boot server for pc3. Install to /etc/dnsmasq.d/pxe-pc3.conf
#
# It acts as a REAL DHCP server, but ONLY for the pc3 machine's MAC address.
# Every other device is ignored (dhcp-ignore), so your router keeps serving the
# rest of the LAN exactly as before. This avoids the proxy-DHCP race where iPXE
# re-asks for an IP and the router doesn't re-offer in time.
port=0                       # no DNS from dnsmasq (avoids clashing with systemd-resolved)
log-dhcp
user=chris                   # so it can read the TFTP dir under /home/chris
group=chris
enable-tftp
tftp-root=/home/chris/pxe/tftp
interface=enp45s0
bind-interfaces

# The pc3 server's hardware MAC (what its PXE ROM and iPXE use).
dhcp-host=<MAC_ADDRESS>,set:pc3,<LAN_IP>,pc3
dhcp-range=tag:pc3,<LAN_IP>,<LAN_IP>,255.255.252.0,12h
dhcp-ignore=tag:!pc3          # everyone else: stay silent, let the router answer
# Only answer the two network-boot stages (the PXE ROM and iPXE both send vendor
# class "PXEClient"). The installer's own DHCP (dhcpcd in the initramfs) and the
# installed system are left to the router: that avoids a duplicate-address clash
# seen with a proxy-ARP device on the LAN (it "claimed" <LAN_IP>) and keeps
# pc3 on a router-known address.
dhcp-vendorclass=set:pxe,PXEClient
dhcp-ignore=tag:pc3,tag:!pxe
dhcp-option=tag:pc3,option:router,<LAN_IP>
dhcp-option=tag:pc3,option:dns-server,<LAN_IP>
# NFS path for the installer (belt-and-braces; the kernel args also carry it)
dhcp-option=tag:pc3,option:root-path,<HEAD_IP>:/srv/pc3-iso

# Boot file selection.
# Is the client already running iPXE? (iPXE sets DHCP option 175)
dhcp-match=set:ipxe,175
# UEFI x86-64 clients advertise arch 7 or 9; everything else is legacy BIOS.
dhcp-match=set:efi64,option:client-arch,7
dhcp-match=set:efi64,option:client-arch,9
# First boot (not yet iPXE): hand the right iPXE build over TFTP.
dhcp-boot=tag:!ipxe,tag:efi64,ipxe.efi
dhcp-boot=tag:!ipxe,tag:!efi64,undionly.kpxe
# Second boot (now iPXE): hand our install script over TFTP.
dhcp-boot=tag:ipxe,boot.ipxe
